name: daily-tech-digest

# Full pipeline: ingest -> dedup -> rank -> LLM -> publish -> commit -> GitHub Pages.
# Same-day re-runs are idempotent: when today's digest already exists the
# publish step is a no-op (the LLM is non-deterministic, so a second run
# would otherwise overwrite the day's post with different text). Manual
# dispatches can set `force` to regenerate anyway.
#
# TWO cron schedules on purpose: GitHub Actions cron is notoriously lossy at
# popular wall-clock times (runs get silently skipped under load). The second
# slot is a same-day safety net - thanks to idempotency it either publishes
# the missed digest or no-ops. Off-round minutes reduce contention further.
on:
  schedule:
    - cron: "37 4 * * *"   # primary: 08:07 Asia/Tehran
    - cron: "43 7 * * *"   # safety net: 11:13 Asia/Tehran, no-ops if the morning run landed
  workflow_dispatch:
    inputs:
      force:
        description: "Regenerate today's digest even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write   # push the daily digest commit
  pages: write      # deploy the site
  id-token: write   # OIDC for deploy-pages
  actions: write    # delete stale github-pages artifacts on re-runs

concurrency:
  group: daily-tech-digest
  cancel-in-progress: false

jobs:
  publish-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Secrets never enter the repo: .env is generated at runtime and gitignored.
      # LLM_MODEL is a repo *variable* (optional); default = a zero-balance model.
      - name: Write .env from secrets
        run: |
          {
            echo "LLM_PROVIDER=glm"
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}"
            echo "LLM_BASE_URL=https://api.b.ai/v1"
            echo "LLM_MODEL=${{ vars.LLM_MODEL || 'qwen3.8-flash' }}"
            echo "DIGEST_LANGUAGE=en"
          } > .env

      # Fail fast on a malformed secret BEFORE ingesting hundreds of articles:
      # with a bad key every summarize fails in isolation and the only signal
      # used to be a red "no digest" guard at the very end of the run. Only
      # verdicts are printed - the key value itself never reaches the logs.
      - name: Validate LLM configuration
        run: |
          python - <<'PY'
          import os, re

          key = os.environ.get("LLM_API_KEY", "").strip().strip('"').strip("'")
          if not key:
              raise SystemExit("LLM_API_KEY is empty")
          if key.lower().startswith("bearer "):
              raise SystemExit("LLM_API_KEY must not include the 'Bearer ' prefix")
          if "LLM_API_KEY" in key or re.match(r"^(export\s+)?[A-Za-z_][A-Za-z0-9_]*\s*=", key):
              raise SystemExit("LLM_API_KEY looks like a pasted env line - store ONLY the raw key value")
          if any(ch.isspace() for ch in key):
              raise SystemExit("LLM_API_KEY contains internal whitespace")
          print("LLM_API_KEY format looks valid; model =", os.environ.get("LLM_MODEL", "?"))
          PY
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3.8-flash' }}

      - name: Build the daily digest
        # skips by itself when today's editions exist; --force only on demand
        run: python -m src.main --publish ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}

      - name: Commit the digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain posts/)" ]; then
            git add posts/
            git commit -m "digest: daily tech digest $(date -u +%F)"
            git push
          else
            echo "no new digest to commit"
          fi

      # First-ever enablement is one-time manual (repo must exist as a Pages
      # site: Settings -> Pages -> Source: GitHub Actions); afterwards this
      # step just finds the existing site on every run.
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Remove stale github-pages artifacts from earlier attempts
        # Re-running a failed job keeps the previous attempt's upload, and
        # deploy-pages aborts with "Multiple artifacts named github-pages".
        # Delete them so every attempt ends with exactly one artifact.
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "deleted stale artifact $id"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify a digest exists for today
        # The publish step exits 0 even when the LLM yields nothing: every
        # summarize/translate failure is isolated, and "no successfully
        # summarized items" just logs an error. That made no-digest days look
        # like green runs. Same-day no-op re-runs still pass here - the
        # morning file already exists on disk.
        run: |
          today="$(date -u +%F)"
          if ! ls posts/"$today"-tech-digest*.md >/dev/null 2>&1; then
            echo "::error::no digest for $today - inspect the 'Build the daily digest' step log"
            exit 1
          fi
          echo "digest for $today: $(ls posts/"$today"-tech-digest*.md | tr '\n' ' ')"
