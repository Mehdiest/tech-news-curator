name: Daily TechTally Digest

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.8-flash' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Gemini configuration
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::GEMINI_API_KEY secret is empty."
            exit 1
          fi

          echo "Gemini API key is configured."

      - name: Create environment file
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail

          {
            echo "LLM_PROVIDER=gemini"
            echo "LLM_API_KEY=${GEMINI_API_KEY}"
            echo "LLM_BASE_URL=https://generativelanguage.googleapis.com/v1beta"
            echo "LLM_MODEL=${LLM_MODEL}"
            echo "LLM_TEMPERATURE=0.7"
            echo "LLM_MAX_TOKENS=12000"
            echo "LLM_TIMEOUT=60"
            echo "DIGEST_LANGUAGE=en"
          } > .env

      - name: Run TechTally
        run: |
          python -m src.main --publish

      - name: Verify generated digest
        run: |
          set -euo pipefail

          if ! find . -type f -name '*.md' \
            -not -path './.git/*' \
            | grep -q .; then
            echo "::error::No Markdown digest was generated."
            exit 1
          fi

          echo "Digest generation completed."

      - name: Commit generated digest
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No digest changes to commit."
            exit 0
          fi

          git commit -m "techtally: daily digest $(date -u +%Y-%m-%d)"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

