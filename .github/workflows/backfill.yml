name: backfill-translations

# One-click repair for already-published digests: fills the (item, language)
# pairs that fell back to English (LLM hiccups before the retry fix existed)
# and rewrites the affected days with the current renderer. Idempotent by
# design - pairs that are already translated are never re-translated.
#
# Requires the same LLM_API_KEY secret as the daily workflow. A --dry-run
# dispatch reports the gaps in the log without calling the LLM or writing.
#
# The repaired days are ALSO deployed to GitHub Pages right here. With the
# Pages source set to "GitHub Actions" a plain push does NOT rebuild the
# site, so without this deploy block the new editions (e.g. hi/ru/ar after
# a languages-config change) would only go live with tomorrow's daily run.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Repair only the N newest days (empty = all days)"
        type: string
        default: ""
      langs:
        description: "Comma-separated language codes to fill (empty = all, e.g. fa)"
        type: string
        default: ""
      dry_run:
        description: "Report only - no LLM calls, no writes"
        type: boolean
        default: false

permissions:
  contents: write   # push the repair commit
  pages: write      # deploy the repaired site
  id-token: write   # OIDC for deploy-pages
  actions: write    # delete stale github-pages artifacts on re-runs

concurrency:
  group: backfill-translations
  cancel-in-progress: false

env:
  LLM_MODEL: ${{ vars.LLM_MODEL || 'nvidia/nemotron-3-ultra-550b-a55b:free' }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write .env from secrets
        run: |
          {
            echo "LLM_PROVIDER=glm"
            echo "LLM_API_KEY=${{ secrets.LLM_API_KEY }}"
            echo "LLM_BASE_URL=https://openrouter.ai/api/v1"
            echo "LLM_MODEL=${{ env.LLM_MODEL }}"
            echo "DIGEST_LANGUAGE=en"
          } > .env

      - name: Backfill translations
        run: |
          args=""
          if [ -n "${{ inputs.days }}" ]; then args="$args --days ${{ inputs.days }}"; fi
          if [ -n "${{ inputs.langs }}" ]; then args="$args --langs ${{ inputs.langs }}"; fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then args="$args --dry-run"; fi
          python scripts/backfill_translations.py $args

      - name: Commit the repaired digests
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed="$(git status --porcelain posts/ _includes/latest_digest.html _data/latest_digest.yml)"
          if [ -n "$changed" ]; then
            git add posts/ _includes/latest_digest.html _data/latest_digest.yml
            git commit -m "backfill: repair translations $(date -u +%F)"
            git pull --rebase origin ${GITHUB_REF_NAME:-main}
            git push
          else
            echo "nothing to repair"
          fi

      # Pages deploy, mirroring the daily workflow: a repaired (or newly
      # added) edition only reaches https://.../techtally/ after a
      # deploy-pages run, never through the bare `git push` above.
      - name: Configure GitHub Pages
        if: ${{ inputs.dry_run != true }}
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the Jekyll site
        if: ${{ inputs.dry_run != true }}
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Remove stale github-pages artifacts from earlier attempts
        if: ${{ inputs.dry_run != true }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[] | select(.name == "github-pages") | .id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "deleted stale artifact $id"
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload the site artifact
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        if: ${{ inputs.dry_run != true }}
        uses: actions/deploy-pages@v4
