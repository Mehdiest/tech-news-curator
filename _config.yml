# Jekyll configuration for GitHub Pages - consumed by actions/jekyll-build-pages.
title: TechTally - Tech News by Mehdi Esteghlal
description: "TechTally - the day's top tech stories, ranked and summarized with expert commentary. A daily tech tally curated by Mehdi Esteghlal."
# One-line brand tagline - rendered in the homepage hero (index.md).
tagline: "Counting what matters in tech, every day."
timezone: UTC

# Curator identity - drives the byline, footer links, profile sidebar, and JSON-LD Person schema.
author:
  name: Mehdi Esteghlal
  role: "Independent Backend & AI Developer"
  location: ""
  linkedin: https://www.linkedin.com/in/mehdi-esteghlal-317a67100
  github: https://github.com/Mehdiest
  # Avatar WITHOUT shipping the photo inside this repository.
  # How it works: GitHub serves any user's public profile picture at
  # https://github.com/<username>.png - set your photo as your GitHub
  # profile image once and the sidebar shows it automatically (and stays
  # in sync when you ever change it). Prefer a different picture? Paste
  # any direct image-CDN URL instead (Cloudinary, imgbb, postimages, ...).
  # Then remove the local copy from the repo:
  #   git rm assets/img/avatar.jpg
  # And to also scrub it from ALL past commits (it stays visible in
  # history otherwise - SHAs get rewritten, so expect a force push):
  #   pip install git-filter-repo
  #   git filter-repo --path assets/img/avatar.jpg --invert-paths --force
  #   git push --force origin main
  avatar: "https://github.com/Mehdiest.png"
repository: https://github.com/Mehdiest/techtally

markdown: kramdown

# jekyll-sitemap is whitelisted by GitHub Pages and emits sitemap.xml on build.
plugins:
  - jekyll-sitemap

# Every digest page gets the article layout; index.md opts into home explicitly.
defaults:
  - scope:
      path: "posts"
    values:
      layout: digest
  - scope:
      path: ""
    values:
      layout: default

# The Pages site ships content only - no source code, no CI, no env files.
exclude:
  - src
  - scripts
  - config
  - .github
  - requirements.txt
  - .env
  - .env.example
  - .gitignore
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
