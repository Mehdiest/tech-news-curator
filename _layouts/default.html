<!DOCTYPE html>
<!-- lang from front-matter; dir derived from lang (Jekyll's built-in page directory attribute
     shadows front-matter "dir", so a lang->direction map is the only reliable source) -->
{% assign rtl_langs = 'fa,ar,he,ur' | split: ',' %}
<html lang="{{ page.lang | default: 'en' }}" dir="{% if rtl_langs contains page.lang %}rtl{% else %}ltr{% endif %}">
<head>
  {% include head.html %}
</head>
<body>
  <div class="page-shell">
    {% include sidebar.html %}

    <div class="page-content">
      <header class="site-header">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        <nav>
          <a href="{{ site.author.linkedin }}" rel="me">LinkedIn</a>
          <a href="{{ site.author.github }}" rel="me">GitHub</a>
        </nav>
      </header>

      <main class="site-main">
        {{ content }}
      </main>

      <!-- Site-wide footer: the curator credit ships on every single page -->
      <footer class="site-footer">
        <p>
          Curated by <strong>{{ site.author.name }}</strong>
          &middot; <a href="{{ site.author.linkedin }}" rel="me">LinkedIn</a>
          &middot; <a href="{{ site.author.github }}" rel="me">GitHub</a>
        </p>
        <p>
          Daily digest auto-generated by
          <a href="{{ site.repository }}">tech-news-curator</a>.
        </p>
      </footer>
    </div>
  </div>
</body>
</html>
