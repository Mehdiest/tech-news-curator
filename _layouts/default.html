<!DOCTYPE html>
<!-- lang/dir come from each page's front-matter; translated editions (fa) render RTL -->
<html lang="{{ page.lang | default: 'en' }}" dir="{{ page.dir | default: 'ltr' }}">
<head>
  {% include head.html %}
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav>
      <a href="{{ site.author.linkedin }}" rel="me">LinkedIn</a>
      <a href="{{ site.author.github }}" rel="me">GitHub</a>
    </nav>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <!-- Site-wide footer: the curator credit ships on every single page -->
  <footer class="site-footer">
    <p>
      Curated by <strong>{{ site.author.name }}</strong>
      &middot; <a href="{{ site.author.linkedin }}" rel="me">LinkedIn</a>
      &middot; <a href="{{ site.author.github }}" rel="me">GitHub</a>
    </p>
    <p>
      Daily digest auto-generated by
      <a href="{{ site.repository }}">tech-news-curator</a>.
    </p>
  </footer>
</body>
</html>
