# Localized UI labels for the translated digest editions (stage 7).
#
# This file is intentionally UTF-8 DATA: native language names and labels.
# All project CODE stays ASCII. Unknown language codes fall back to the
# "en" block, which mirrors the built-in defaults in markdown_writer.py.
# Placeholders (__DATE__, __N__, __S__, __NWORD__, __SWORD__, __NAME__,
# __REPO__, __STAMP__) are replaced at render time; never use .format().
# __NWORD__/__SWORD__ resolve to story_one/story_many and
# source_one/source_many, so "1 story from 1 source" and
# "8 stories from 5 sources" stay grammatical in every language.
# meta_description deliberately carries no item count (no agreement
# problems, and it reads more naturally as an SEO snippet).

en:
  native_name: English
  dir: ltr
  og_locale: en_US
  meta_description: "TechTally daily digest for __DATE__: the day's top tech stories summarized with expert commentary"
  meta_by: ", curated by __NAME__."
  intro: "__N__ __NWORD__ from __S__ __SWORD__, ranked by coverage, community signal, and recency."
  read_in: "Read this digest in"
  curated_by: "Curated by"
  footer_by: "Curated by:"
  generated: "Auto-generated by __REPO__ on __STAMP__."
  source: "Source"
  topic: "Topic"
  coverage: "Coverage"
  source_one: "source"
  source_many: "sources"
  story_one: "story"
  story_many: "stories"
  discuss: "Discussion"
  summary_h: "Summary"
  take_h: "My Take"

